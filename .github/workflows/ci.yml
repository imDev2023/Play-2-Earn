name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege by default. Nothing in this workflow writes to the repo, so the
# token it runs with should not be able to: the default grant is broad, and a
# compromised dependency in any step below inherits whatever it is given.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA, not by tag. A tag is a moving pointer the
      # action's owner can repoint at any time, so `@v4` is a standing instruction to
      # run whatever they publish next - which is the shape of every recent CI supply
      # chain compromise. The trailing comment records which release each SHA is.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The contracts package now imports property mixins from the
          # evm-security-standards submodule, so a checkout without it cannot compile.
          submodules: recursive

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails the build on a critical production advisory. Dev-only advisories are
      # excluded deliberately: they never reach a player, and a gate that cries wolf
      # about the test runner is one people learn to ignore.
      #
      # The threshold is `critical` rather than `high` because six high advisories are
      # currently open and accepted, every one of them in code that does not reach a
      # browser. They are recorded with their reasoning in
      # docs/ops/dependency-advisories.md, which is the thing to update when this
      # changes - not this threshold. Setting the gate where the tree actually is keeps
      # it meaningful; setting it where the tree ought to be makes it noise.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build (compile contracts + next build)
        run: npm run build

      - name: Verifier tests
        run: npm test --workspace @rushood/verifier

      - name: Contract tests
        run: npm test --workspace @rushood/contracts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: packages/web

      - name: Web E2E tests
        run: npm test --workspace @rushood/web

  # The connected path needs the opposite world from the job above: a running chain
  # with the contracts deployed and the relayer settling, where `build-and-test`'s
  # admin specs assert the chain is unreachable. Separate job rather than more steps,
  # so neither suite can be run against the wrong stack.
  connected-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run build --workspace @rushood/contracts

      - name: Start the chain
        run: npm run node --workspace @rushood/contracts > /tmp/hardhat-node.log 2>&1 &

      - name: Wait for the chain
        run: |
          for i in $(seq 1 60); do
            if curl -sf -X POST -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
              http://127.0.0.1:8545 > /dev/null; then
              echo "chain up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "chain never came up"; cat /tmp/hardhat-node.log; exit 1

      - name: Mine on an interval
        run: |
          rpc() { curl -sf -X POST -H 'Content-Type: application/json' --data "$1" http://127.0.0.1:8545; }
          rpc '{"jsonrpc":"2.0","method":"evm_setAutomine","params":[true],"id":1}'
          rpc '{"jsonrpc":"2.0","method":"evm_setIntervalMining","params":[2000],"id":1}'

      - name: Deploy the skeleton
        run: npm run deploy:skeleton --workspace @rushood/contracts

      # No RELAYER_SEED, so both the deploy and the relayer use the same default
      # master seed and the hashchain the relayer reveals matches the genesis
      # commitment the game was deployed with.
      - name: Start the relayer
        run: npm run relayer --workspace @rushood/contracts > /tmp/relayer.log 2>&1 &

      # The bet spec waits 90s for a settlement only the relayer can write, so a
      # relayer that never came up fails as a timeout in a test about betting rather
      # than as the startup problem it is.
      - name: Wait for the relayer
        run: |
          for i in $(seq 1 60); do
            if grep -q "Relayer ready" /tmp/relayer.log 2>/dev/null; then
              echo "relayer up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "relayer never came up"; cat /tmp/relayer.log; exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: packages/web

      - name: Connected E2E tests
        run: npm run test:connected --workspace @rushood/web

      - name: Stack logs on failure
        if: failure()
        run: |
          echo "--- hardhat node ---"; tail -100 /tmp/hardhat-node.log || true
          echo "--- relayer ---"; tail -100 /tmp/relayer.log || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: connected-e2e-traces
          path: packages/web/test-results/
          retention-days: 7
